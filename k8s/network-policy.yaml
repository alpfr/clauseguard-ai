apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clauseguard-ai-ingress-only
  namespace: default
  labels:
    app: clauseguard-ai
spec:
  podSelector:
    matchLabels:
      app: clauseguard-ai
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
